{% extends 'base.html' %}
{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar">
            <h6 class="text-white text-center mb-3"><i class="bi bi-person-circle"></i> Customer Panel</h6>
            <a href="{% url 'customer_dashboard' %}"><i class="bi bi-speedometer2"></i> Dashboard</a>
            <a href="{% url 'my_requests' %}"><i class="bi bi-clipboard-list"></i> My Requests</a>
            <a href="{% url 'create_request' %}" class="active"><i class="bi bi-plus-circle"></i> New Request</a>
            <a href="{% url 'my_vehicles' %}"><i class="bi bi-car-front"></i> My Vehicles</a>
            <a href="{% url 'add_vehicle' %}"><i class="bi bi-plus"></i> Add Vehicle</a>
        </div>
        <div class="col-md-10 p-4">
            <h3 class="mb-4"><i class="bi bi-plus-circle"></i> New Service Request</h3>
            <div class="card">
                <div class="card-body p-4">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">Select Vehicle</label>
                            <select name="vehicle_id" class="form-select" required>
                                {% for v in vehicles %}
                                <option value="{{ v.id }}">{{ v.brand }} {{ v.model }} - {{ v.vehicle_number }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Service Type</label>
                            <select name="service_type" class="form-select">
                                <option value="">-- Select Service --</option>
                                {% for sp in service_prices %}
                                <option value="{{ sp.service_type }}">
                                    {{ sp.service_type }} - {{ sp.vehicle_type }} - Rs.{{ sp.final_price }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Problem Description</label>
                            <textarea name="problem_description" class="form-control" rows="3" required placeholder="Describe your vehicle problem..."></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Preferred Date</label>
                            <input type="date" name="preferred_date" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-send"></i> Submit Request
                        </button>
                        <a href="{% url 'my_requests' %}" class="btn btn-secondary ms-2">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
