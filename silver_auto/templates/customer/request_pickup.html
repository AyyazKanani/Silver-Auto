{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card">
                <div class="card-header text-white" style="background:#1a1a2e;">
                    <h4><i class="bi bi-car-front-fill"></i> Request Pickup & Drop</h4>
                </div>
                <div class="card-body p-4">
                    <p><strong>Vehicle:</strong> {{ service_req.vehicle.brand }} {{ service_req.vehicle.model }}</p>
                    <p><strong>Problem:</strong> {{ service_req.problem_description }}</p>
                    <hr>
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">Pickup Address</label>
                            <textarea name="pickup_address" class="form-control" rows="2" required placeholder="Your address for vehicle pickup"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Pickup Date & Time</label>
                            <input type="datetime-local" name="pickup_time" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-send"></i> Submit Pickup Request
                        </button>
                        <a href="{% url 'my_requests' %}" class="btn btn-secondary w-100 mt-2">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
