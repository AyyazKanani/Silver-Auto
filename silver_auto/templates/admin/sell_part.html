{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card">
                <div class="card-header text-white" style="background:#1a1a2e;">
                    <h4><i class="bi bi-cart"></i> Sell Part</h4>
                </div>
                <div class="card-body p-4">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">Select Part</label>
                            <select name="part_id" class="form-select" required>
                                {% for part in parts %}
                                <option value="{{ part.id }}">{{ part.part_name }} - {{ part.vehicle_type }} - Rs.{{ part.price }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Quantity</label>
                            <input type="number" name="quantity" class="form-control" min="1" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">
                            <i class="bi bi-cart-check"></i> Sell
                        </button>
                        <a href="{% url 'parts_list' %}" class="btn btn-secondary w-100 mt-2">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
